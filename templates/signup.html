<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Smart Expense</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-logo">
                💰
            </div>

            <h1>Create Account</h1>

            <p class="login-subtitle">
                Start managing your spending smarter
            </p>

            <form action="/signup"
                  method="POST">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>

                {% if error %}

                    <p class="login-error">
                        {{ error }}
                    </p>

                {% endif %}

                <button
                    type="submit"
                    class="login-button">
                    Create Account
                </button>

            </form>

            <p class="signup-text">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </p>

        </div>

    </div>

</body>

</html>
