<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Expense - Smart Expense Intelligence</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="app-container">


    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="mobile-menu-header">

            <div class="sidebar-logo">

                <h2>Smart Expense</h2>

                <p>Intelligence</p>

            </div>

            <button class="menu-toggle" onclick="toggleMenu()">
                ☰
            </button>

        </div>


        <nav class="sidebar-nav">

            <a href="/dashboard" class="nav-item">
                🏠
                <span>Dashboard</span>
            </a>

            <a href="/prediction" class="nav-item">
                🤖
                <span>Prediction & Insights</span>
            </a>

            <a href="/history" class="nav-item">
                📅
                <span>History</span>
            </a>

            <a href="/transactions" class="nav-item">
                💳
                <span>Recent Transactions</span>
            </a>

            <a href="/unusual" class="nav-item">
                ⚠️
                <span>Unusual Transactions</span>
            </a>

            <a href="/add-expense" class="nav-item add-nav-item active">
                ➕
                <span>Add Expense</span>
            </a>

            <div class="sidebar-divider"></div>

            <a href="/logout" class="nav-item logout-nav-item">
                🚪
                <span>Logout</span>
            </a>

        </nav>

    </aside>



    <!-- ================= MAIN CONTENT ================= -->

    <main class="main-content">


        <!-- ================= PAGE HEADER ================= -->

        <div class="page-header">

            <div>

                <h1>Add Expense</h1>

                <p>
                    Enter your expense details to track your spending.
                </p>

            </div>

            <a href="/dashboard" class="back-button">
                ← Back to Dashboard
            </a>

        </div>



        <!-- ================= EXPENSE FORM ================= -->

        <div class="dashboard-card">

            <div class="card-header">

                <div>

                    <h2>💰 Expense Details</h2>

                    <p>
                        Add a new expense to your spending records.
                    </p>

                </div>

            </div>



            <form
                id="expenseForm"
                action="/add-expense"
                method="POST"
            >


                <!-- Expense Date -->

                <div class="form-group">

                    <label for="expense_date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="expense_date"
                        name="expense_date"
                        required
                    >

                </div>



                <!-- Expense Description -->

                <div class="form-group">

                    <label for="description">
                        Expense Description
                    </label>

                    <input
                        type="text"
                        id="description"
                        name="description"
                        placeholder="Example: ordered pizza for dinner"
                        required
                    >

                </div>



                <!-- Amount -->

                <div class="form-group">

                    <label for="amount">
                        Amount (₹)
                    </label>

                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        placeholder="Enter amount"
                        min="0.01"
                        step="0.01"
                        required
                    >

                </div>



                <!-- Payment Method -->

                <div class="form-group">

                    <label for="payment_method">
                        Payment Method
                    </label>

                    <select
                        id="payment_method"
                        name="payment_method"
                        required
                    >

                        <option value="" disabled selected>
                            Select payment method
                        </option>

                        <option value="Debit Card">
                            Debit Card
                        </option>

                        <option value="Net Banking">
                            Net Banking
                        </option>

                        <option value="Credit Card">
                            Credit Card
                        </option>

                        <option value="UPI">
                            UPI
                        </option>

                        <option value="Cash">
                            Cash
                        </option>

                    </select>

                </div>



                <!-- Time of Day -->

                <div class="form-group">

                    <label for="time_of_day">
                        Time of Day
                    </label>

                    <select
                        id="time_of_day"
                        name="time_of_day"
                        required
                    >

                        <option value="" disabled selected>
                            Select time
                        </option>

                        <option value="Morning">
                            Morning
                        </option>

                        <option value="Afternoon">
                            Afternoon
                        </option>

                        <option value="Evening">
                            Evening
                        </option>

                        <option value="Night">
                            Night
                        </option>

                    </select>

                </div>



                <!-- Submit -->

                <button
                    type="submit"
                    id="submitExpenseButton"
                >
                    Add Expense
                </button>


            </form>


        </div>


    </main>

</div>



<!-- ================= MOBILE MENU ================= -->

<script>

function toggleMenu() {

    const menu =
        document.querySelector(".sidebar-nav");

    menu.classList.toggle("show");

}

</script>



<!-- ================= SET TODAY'S DATE ================= -->

<script>

document.addEventListener("DOMContentLoaded", function() {

    const dateInput =
        document.getElementById("expense_date");

    const today = new Date();

    const year =
        today.getFullYear();

    const month =
        String(
            today.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            today.getDate()
        ).padStart(2, "0");

    dateInput.value =
        `${year}-${month}-${day}`;

});

</script>



<!-- ================= PREVENT DOUBLE SUBMISSION ================= -->

<script>

document.addEventListener("DOMContentLoaded", function() {

    const form =
        document.getElementById("expenseForm");

    const submitButton =
        document.getElementById("submitExpenseButton");

    form.addEventListener("submit", function() {

        submitButton.disabled = true;

        submitButton.textContent =
            "Adding Expense...";

    });

});

</script>


</body>

</html>
